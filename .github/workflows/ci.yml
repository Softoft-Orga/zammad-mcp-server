name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src

      - name: Tests with coverage
        run: uv run pytest --cov=zammad_mcp_server --cov-report=term-missing --cov-fail-under=80

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t zammad-mcp-server:ci .
      - name: Start HTTP transport
        run: |
          docker run -d --name mcp-smoke -p 8000:8000 \
            -e ZAMMAD_URL=http://example.invalid \
            -e ZAMMAD_HTTP_TOKEN=ci-token \
            zammad-mcp-server:ci
          for i in $(seq 1 30); do
            if python3 -c "import socket; s=socket.create_connection(('127.0.0.1',8000),1); s.close()"; then
              echo "port 8000 is listening"
              docker rm -f mcp-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs mcp-smoke
          docker rm -f mcp-smoke
          exit 1

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Start Zammad stack
        working-directory: docker
        run: |
          docker compose up -d
      - name: Wait for Zammad
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080 >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Integration tests
        env:
          OTAI_RUN_ZAMMAD_INTEGRATION: "1"
          ZAMMAD_URL: http://localhost:8080
          ZAMMAD_HTTP_TOKEN: ${{ secrets.ZAMMAD_HTTP_TOKEN }}
        run: uv run pytest tests/integration/ -m integration
